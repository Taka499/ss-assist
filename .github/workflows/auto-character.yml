name: Auto-detect new characters

on:
  schedule:
    # Weekly on Wednesday at 14:00 UTC = 23:00 JST
    - cron: '0 14 * * 3'
  workflow_dispatch: # Manual trigger from Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.cpr.outputs.pull-request-operation }}
      number: ${{ steps.cpr.outputs.pull-request-number }}
      url: ${{ steps.cpr.outputs.pull-request-url }}
      head: ${{ steps.cpr.outputs.pull-request-head-sha }}
      title: ${{ steps.ask.outputs.title }}
      body: ${{ steps.ask.outputs.body }}
      image: ${{ steps.ask.outputs.image }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run data sync
        id: sync
        run: |
          npm run sync:data -- --output-json /tmp/sync-result.json || EXIT_CODE=$?
          if [ "${EXIT_CODE:-0}" -eq 2 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          elif [ "${EXIT_CODE:-0}" -eq 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            exit "${EXIT_CODE}"
          fi

      - name: Validate updated data
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          npm run build:data
          npm run validate:data

      - name: Generate PR body
        if: steps.sync.outputs.has_changes == 'true'
        id: pr_body
        run: |
          BODY=$(node -e "
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('/tmp/sync-result.json', 'utf-8'));
            const lines = ['## Auto-synced data from StellaSoraData\n'];
            if (result.newCharacters.length > 0) {
              lines.push('### New Characters');
              result.newCharacters.forEach(c => lines.push('- ' + c.id + ': ' + c.name_ja));
              lines.push('');
            }
            if (result.newCommissions.length > 0) {
              lines.push('### New Commissions');
              result.newCommissions.forEach(c => lines.push('- ' + c.id + ': ' + c.name_ja));
              lines.push('');
            }
            if (result.updatedCharacters.length > 0) {
              lines.push('### Updated Characters');
              result.updatedCharacters.forEach(c => lines.push('- ' + c.id + ': ' + c.name_ja + ' [' + c.fields.join(', ') + ']'));
              lines.push('');
            }
            if (result.updatedCommissions.length > 0) {
              lines.push('### Updated Commissions');
              lines.push(result.updatedCommissions.length + ' commission(s) updated');
              lines.push('');
            }
            if (result.newTags.length > 0) {
              lines.push('### New Tags');
              result.newTags.forEach(t => lines.push('- ' + t.category + ': ' + t.ja));
              lines.push('');
            }
            if (result.warnings.length > 0) {
              lines.push('### Warnings');
              result.warnings.forEach(w => lines.push('- ' + w));
              lines.push('');
            }
            lines.push('### Review Checklist');
            lines.push('- [ ] Verify new character icons look correct');
            lines.push('- [ ] Check any new faction/tag names');
            lines.push('- [ ] Review any warnings above');
            lines.push('- [ ] Run the app locally to verify');
            console.log(lines.join('\n'));
          ")
          # Write to file for multi-line handling
          echo "$BODY" > /tmp/pr-body.md

      - name: Generate PR title
        if: steps.sync.outputs.has_changes == 'true'
        id: pr_title
        run: |
          TITLE=$(node -e "
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('/tmp/sync-result.json', 'utf-8'));
            const parts = [];
            if (result.newCharacters.length > 0) parts.push(result.newCharacters.length + ' new char(s)');
            if (result.newCommissions.length > 0) parts.push(result.newCommissions.length + ' new commission(s)');
            if (result.updatedCharacters.length > 0) parts.push(result.updatedCharacters.length + ' updated char(s)');
            if (result.updatedCommissions.length > 0) parts.push(result.updatedCommissions.length + ' updated commission(s)');
            console.log('data: auto-sync ' + parts.join(', '));
          ")
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.sync.outputs.has_changes == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          base: develop
          branch: auto/sync-data
          delete-branch: true
          title: ${{ steps.pr_title.outputs.title }}
          body-path: /tmp/pr-body.md
          commit-message: 'data: auto-sync from StellaSoraData'
          add-paths: |
            data-sources/
            data/tags.src.json
            i18n/tags/
            public/assets/characters/

      # A Nudge request approves one exact commit, so a new one is raised
      # whenever the pull request is created or its head changes.
      - name: Build approval request
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        id: ask
        env:
          HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_TITLE: ${{ steps.pr_title.outputs.title }}
        run: |
          node <<'JS'
          const fs = require('fs');
          const crypto = require('crypto');
          const result = JSON.parse(fs.readFileSync('/tmp/sync-result.json', 'utf-8'));
          const { HEAD_SHA, PR_NUMBER, PR_TITLE, GITHUB_REPOSITORY, GITHUB_OUTPUT } = process.env;
          const chars = result.newCharacters;

          let title = PR_TITLE;
          if (chars.length === 1) title = 'New character: ' + chars[0].name_ja;
          if (chars.length > 1) title = 'New characters: ' + chars.map(c => c.name_ja).join(', ');

          const lines = [
            'Approve merges #' + PR_NUMBER + ' into develop and promotes develop to main, deploying to production. ' +
              'Nothing newer than commit ' + HEAD_SHA.slice(0, 7) + ' is merged.',
          ];
          if (chars.length > 0) {
            lines.push('');
            chars.forEach(c => lines.push(c.id + ': ' + c.name_ja));
          }
          if (chars.length > 1) {
            lines.push('Icon shown: ' + chars[0].name_ja + '; check the others on the pull request.');
          }
          lines.push('');
          lines.push(
            'New commissions: ' + result.newCommissions.length +
            ', updated characters: ' + result.updatedCharacters.length +
            ', updated commissions: ' + result.updatedCommissions.length
          );

          // Icons are Git LFS objects: raw.githubusercontent.com serves the
          // pointer file, media.githubusercontent.com serves the PNG.
          const image = chars.length > 0
            ? 'https://media.githubusercontent.com/media/' + GITHUB_REPOSITORY + '/' + HEAD_SHA +
              '/public/assets/characters/' + chars[0].id + '.png'
            : '';

          const out = [];
          for (const [name, value] of Object.entries({ title, body: lines.join('\n'), image })) {
            const delimiter = 'EOF_' + crypto.randomBytes(16).toString('hex');
            out.push(name + '<<' + delimiter, value, delimiter);
          }
          fs.appendFileSync(GITHUB_OUTPUT, out.join('\n') + '\n');
          JS

  ask:
    needs: sync
    if: needs.sync.outputs.operation == 'created' || needs.sync.outputs.operation == 'updated'
    runs-on: ubuntu-latest
    # A job holding id-token: write holds nothing else: any code here could
    # obtain a token naming this repository.
    permissions:
      id-token: write
    steps:
      - name: Ask for approval in Discord
        uses: Taka499/nudge/actions/request@d9f7f1ac185050506d526532a0e24861564422cf # v1.1.0
        with:
          endpoint: https://nudge.tia.run
          title: ${{ needs.sync.outputs.title }}
          body: ${{ needs.sync.outputs.body }}
          url: ${{ needs.sync.outputs.url }}
          commit: ${{ needs.sync.outputs.head }}
          image: ${{ needs.sync.outputs.image }}
